name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Parse version from pubspec
        id: version
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1)
          VERSION_NAME=$(echo "$VERSION_LINE" | sed 's/version: *//' | cut -d+ -f1)
          VERSION_CODE=$(echo "$VERSION_LINE" | sed 's/version: *//' | cut -d+ -f2)
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${VERSION_NAME}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $TAG does not match pubspec version $VERSION_NAME (expected $EXPECTED_TAG)"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=GITHUB_OWNER=exoad \
            --dart-define=GITHUB_REPO=linkvault

      - name: Package release assets
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_NAME="linkvault-${VERSION_NAME}.apk"
          cp "$APK_SRC" "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > linkvault-update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "apkFileName": "${APK_NAME}",
            "sha256": "${SHA256}",
            "publishedAt": "${PUBLISHED_AT}"
          }
          EOF
          echo "${SHA256}  ${APK_NAME}" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            linkvault-${{ steps.version.outputs.version_name }}.apk
            linkvault-update.json
            checksums.txt
